server:
  port: 8080
spring:
  application:
    name: dmp-evaluator-service
  # Jackson Configuration for JSON Processing
  jackson:
    serialization:
      indent_output: true  # Pretty-print JSON
    #default-property-inclusion: non_null  # Ignore null values
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/dmp-evaluator}
      # Spring Data disables this by default; without it, @Indexed(unique = true)
      # on Client.clientId is never actually created in MongoDB.
      auto-index-creation: true

logging:
  level:
    root: info

openapi:
  title: DMP Evaluator Service API
  # Kept in sync manually with <version> in pom.xml
  version: v1.0.0
  description: API for the service that evaluates Data Management Plans (maDMPs)
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

jwt:
  secret: ${JWT_SECRET}
  expiration-seconds: 3600

admin:
  client-id: ${ADMIN_CLIENT_ID:admin}
  client-secret: ${ADMIN_CLIENT_SECRET}
  display-name: ${ADMIN_DISPLAY_NAME:System Administrator}

ratelimit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  capacity: ${RATE_LIMIT_CAPACITY:100}
  refill-tokens: ${RATE_LIMIT_REFILL_TOKENS:100}
  refill-duration-seconds: ${RATE_LIMIT_REFILL_DURATION_SECONDS:60}

dmp:
  global:
    repository: "https://github.com/OSTrails/DMP-Evaluation-Service"
    mitLicense: "https://opensource.org/license/mit"
    unpayWallEndPoint: "https://api.unpaywall.org/v2/"
    unpayWallEmail: "dmpEvalutionService@test.com"
    fairChampionEndPoint: "https://tests.ostrails.eu/assess/test/"
    fairChampionBenchmarkEndpoint: "https://tools.ostrails.eu/champion/assess/algorithm/d/1KVEtC7iT-Fl6-hy3QKsl9FBUNCBk40d121Cl-viake8"
  test:
    endpointURL: ${TEST_URL}
  metric:
    endpointURL: ${METRIC_URL}
  benchmark:
    endpointURL: ${BENCHMARK_URL}

