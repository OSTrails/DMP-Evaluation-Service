version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: mongo-dev
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: dmp-evaluator

  app:
    build: .
    container_name: dmp-evaluator-service
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
    environment:
      MONGODB_URI: mongodb://mongodb:27017/dmp-evaluator

volumes:
  mongo-data:
